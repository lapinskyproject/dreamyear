<title>Год мечты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500;1,600&family=Montserrat:wght@400;500;600;700&display=swap">
</head>
<body>
<style>
/* layout: тёплая плёнка - полароид-герой с датой как у мыльницы, лента месяцев как кадры плёнки, стираемые кадры-закаты, блок «предложи своё» */
:root{
  --cream:#f5ebdc;
  --paper:#fbf6ee;
  --ink:#3a2a1f;
  --ink-soft:#7a6656;
  --orange:#ee9b5b;
  --orange-deep:#d9662b;
  --sky:#8fb3d6;
  --olive:#6b7f45;
  --red:#c8452f;
  --line:#e6d6c0;
  --display:"Cormorant Garamond","Times New Roman",Georgia,serif;
  --body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--cream);color:var(--ink)}
body{font-family:var(--body);font-size:14px;line-height:1.55;padding-inline:16px;padding-block:0 64px;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;opacity:.06;mix-blend-mode:multiply;background-image:var(--grain)}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:56px}
.eyebrow{font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--orange-deep)}

/* шапка */
.top{display:flex;justify-content:space-between;align-items:center;padding-block:18px;gap:12px;margin-bottom:-34px}
.logo{font-family:var(--display);font-style:italic;font-weight:600;font-size:22px}
.lang{display:flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{font:600 11px var(--body);letter-spacing:.12em;border:0;background:transparent;color:var(--ink);padding:6px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

.hero{display:grid;gap:36px;align-items:center}
@media (min-width:860px){.hero{grid-template-columns:1.1fr .9fr}}
.hero-text{display:grid;gap:22px;min-width:0}
h1{font-family:var(--display);font-weight:500;font-size:clamp(56px,11vw,128px);line-height:.86;margin:0;letter-spacing:-.02em}
h1 em{font-style:italic;color:var(--orange-deep);font-weight:500}
.lede{font-size:13.5px;line-height:1.5;max-width:52ch;margin:0;color:var(--ink-soft)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding-top:6px;border-top:1px solid var(--line);max-width:520px}
@media (max-width:859px){.hero{grid-template-columns:minmax(0,1fr)}}
.wrap>*{min-width:0}
.hero-text{grid-template-columns:minmax(0,1fr)}
html,body{overflow-x:clip}
.logo{white-space:nowrap}
@media (max-width:380px){.logo{font-size:19px}.top{gap:8px}.socials a,.socials .soon{width:30px}}
.fact{display:grid;gap:2px}
.fact b{font-family:var(--display);font-weight:500;font-size:40px;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.fact span{font-size:10px;letter-spacing:.12em;line-height:1.35;text-transform:uppercase;color:var(--ink-soft)}

.polaroid{justify-self:center;background:var(--paper);padding:14px 14px 56px;box-shadow:0 18px 40px -18px rgba(90,50,20,.45);transform:rotate(2.5deg);position:relative;max-width:420px;width:100%}
.polaroid .ph{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--orange)}
.polaroid img{width:100%;height:100%;object-fit:cover;filter:saturate(1.08) sepia(.14) contrast(1.02);display:block}
.datestamp{position:absolute;right:12px;bottom:10px;font:700 15px/1 "Courier New",monospace;color:#ff8a2a;letter-spacing:.08em;text-shadow:0 0 6px rgba(255,120,30,.8)}
.polaroid figcaption{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-family:var(--display);font-style:italic;font-size:20px}

/* месяцы как плёнка */
.strip{background:var(--ink);color:var(--paper);border-radius:4px;padding-block:18px;position:relative;overflow-x:auto;scrollbar-width:none;margin-inline:-16px}
.strip::-webkit-scrollbar{display:none}
.strip::before,.strip::after{content:"";position:absolute;left:0;right:0;height:8px;background:radial-gradient(circle at 6px 4px,var(--cream) 2.5px,transparent 3px) 0 0/16px 8px repeat-x;min-width:1100px}
.strip::before{top:4px}.strip::after{bottom:4px}
.strip ul{list-style:none;margin:0;padding:0 16px;display:flex;gap:6px;width:max-content}
.strip button{font:500 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--paper);background:transparent;border:1px solid transparent;border-radius:2px;padding:10px 14px;cursor:pointer;display:grid;gap:2px;text-align:left}
.strip button small{font-size:9px;color:var(--orange);letter-spacing:.2em}
.strip button[aria-pressed="true"]{border-color:var(--orange);background:rgba(238,155,91,.14)}
.strip button.locked{opacity:.5}

.section-head{display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:12px}
h2{font-family:var(--display);font-weight:500;font-size:clamp(36px,6vw,56px);line-height:1;margin:0;text-transform:lowercase}
h2 em{font-style:italic;color:var(--orange-deep)}
.sub{color:var(--ink-soft);font-size:13px;margin:6px 0 0}
.hint{font-size:12px;color:var(--ink-soft);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.linkbtn{font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;background:none;border:0;border-bottom:1px solid currentColor;color:var(--ink);cursor:pointer;padding:2px 0}

/* кадры */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 16px;margin-top:22px}
@media (min-width:680px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:980px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.frame{background:var(--paper);padding:8px 8px 34px;box-shadow:0 10px 24px -14px rgba(90,50,20,.5);position:relative;transition:transform .25s ease}
.frame:nth-child(3n+1){transform:rotate(-1.4deg)}
.frame:nth-child(3n+2){transform:rotate(.9deg)}
.frame:nth-child(3n){transform:rotate(-.4deg)}
.frame.revealed{cursor:pointer}
.frame.revealed:hover{transform:rotate(0) translateY(-4px)}
.shot{position:relative;aspect-ratio:4/5;overflow:hidden;color:#fff;padding:12px;display:flex;flex-direction:column;justify-content:space-between}
.shot.c0{background:linear-gradient(160deg,#f2ad6e,#d9662b)}
.shot.c1{background:linear-gradient(160deg,#a9c6e2,#6f97c2)}
.shot.c2{background:linear-gradient(160deg,#8fa25e,#5c6f3a)}
.shot.c3{background:linear-gradient(160deg,#e07a5a,#b8402c)}
.shot .no{font:600 10px var(--body);letter-spacing:.18em}
.shot h3{font-family:var(--display);font-weight:500;font-style:italic;font-size:clamp(19px,2.1vw,23px);line-height:1.05;margin:0;text-wrap:balance}
.shot .place{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.cap{position:absolute;left:10px;right:10px;bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.tag-real{color:var(--orange-deep);font-weight:700}
.heart{display:flex;align-items:center;gap:4px;border:0;background:none;color:var(--ink-soft);font:600 11px var(--body);cursor:pointer;padding:2px}
.heart svg{width:15px;height:15px}
.heart[aria-pressed="true"]{color:var(--red)}
.heart[aria-pressed="true"] svg path{fill:var(--red)}
canvas.scratch{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;transition:opacity .5s ease}
canvas.scratch.gone{opacity:0;pointer-events:none}
.shot.photo{background-size:cover!important;background-position:center!important}
.shot.photo::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,25,15,.35) 0%,rgba(40,25,15,0) 30%,rgba(40,25,15,0) 50%,rgba(40,25,15,.65) 100%);pointer-events:none}
.shot.photo>.no,.shot.photo>div{position:relative}
.shot.photo .place{display:block;padding-right:64px}
.shot .ds{position:absolute;right:10px;bottom:10px;font:700 12px/1 "Courier New",monospace;color:#ff8a2a;letter-spacing:.06em;text-shadow:0 0 6px rgba(255,120,30,.8)}
.donestamp{position:absolute;top:10px;right:10px;font:700 9px var(--body);letter-spacing:.16em;text-transform:uppercase;color:#fff;border:1.5px solid #fff;border-radius:3px;padding:3px 6px;transform:rotate(6deg)}
.frame.locked .shot{background:linear-gradient(170deg,#e9dccb,#d8c5ad);color:var(--ink-soft);align-items:center;justify-content:center;text-align:center;gap:8px}
.frame.locked .shot h3{font-size:17px}
.frame.shake{animation:shake .35s}
@keyframes shake{25%{translate:-5px 0}50%{translate:5px 0}75%{translate:-3px 0}}
.countdown{font-family:var(--display);font-style:italic;font-size:22px;color:var(--orange-deep);font-variant-numeric:lining-nums tabular-nums}

/* открыть все */
.openall{margin-top:-28px}
.openall button{width:100%;display:grid;gap:4px;justify-items:center;background:var(--orange);color:#fff;border:0;padding:20px 16px;cursor:pointer;
  box-shadow:0 12px 26px -14px rgba(217,102,43,.8);animation:breathe 2.4s ease-in-out infinite}
.oa-big{font-family:var(--display);font-style:italic;font-weight:500;font-size:clamp(26px,5vw,36px);line-height:1}
.oa-small{font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.9}
@keyframes breathe{50%{transform:scale(1.015)}}
/* соцсети */
.socials{margin-left:auto;display:flex;gap:6px;align-items:center}
.socials a,.socials .soon{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--ink)}
.socials svg{width:20px;height:20px}
.socials a:hover{background:var(--line)}
.socials .soon{opacity:.35}
.follow{display:grid;gap:22px}
@media (min-width:860px){.follow{grid-template-columns:1fr 1fr;align-items:end}}
.follow-btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fbtn{display:flex;align-items:center;gap:12px;padding:16px;background:var(--ink);color:var(--paper);text-decoration:none;min-width:0}
.fbtn svg{width:28px;height:28px;flex:none}
.fbtn span{display:grid;min-width:0}
.fbtn b{font-family:var(--display);font-style:italic;font-weight:500;font-size:22px;line-height:1.1}
.fbtn small{font-size:10px;letter-spacing:.08em;opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.fbtn:hover{background:var(--orange-deep)}
.fbtn.off{background:transparent;color:var(--ink-soft);border:1px dashed var(--ink-soft)}
.collab{display:grid;gap:20px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding-block:28px}
@media (min-width:860px){.collab{grid-template-columns:1fr auto;align-items:end;gap:40px}}
.collab-text{display:grid;gap:10px;min-width:0}
.collab-text p{margin:0;color:var(--ink-soft);font-size:15px;max-width:46ch}
.collab-btn{justify-self:start;font:600 12px var(--body);letter-spacing:.18em;text-transform:uppercase;text-decoration:none;color:var(--paper);background:var(--orange-deep);padding:16px 22px}
.collab-btn:hover{background:var(--ink)}
.collab-actions{display:grid;gap:12px;justify-items:start;min-width:0}
.collab-mail{margin:0;font-size:13px;color:var(--ink-soft);overflow-wrap:anywhere}
.collab-mail a{color:var(--ink);text-underline-offset:3px}
.scratch-hint{margin:-34px 0 -44px;font-size:13px;color:var(--ink-soft);max-width:46ch}
/* праздник после открытия */
.leak{position:fixed;inset:0;pointer-events:none;z-index:33;mix-blend-mode:screen;
  background:radial-gradient(60% 50% at 0% 30%,rgba(255,140,60,.85),transparent 70%),radial-gradient(50% 60% at 100% 70%,rgba(220,70,40,.6),transparent 70%),radial-gradient(40% 40% at 50% 50%,rgba(255,235,200,.9),transparent 70%);
  animation:leak 1.1s ease-out forwards}
@keyframes leak{0%{opacity:0;transform:translateX(-30%)}25%{opacity:1}100%{opacity:0;transform:translateX(30%)}}
.floatheart{position:fixed;bottom:-40px;z-index:34;pointer-events:none;opacity:0;animation:floatup var(--d) ease-in forwards}
.floatheart svg{width:100%;height:100%}
.floatheart svg path{fill:currentColor;stroke:none}
@keyframes floatup{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:.95}100%{transform:translate(var(--x),-110vh) scale(1.1) rotate(var(--r));opacity:0}}
.celebrate{position:fixed;left:50%;top:50%;z-index:35;background:var(--paper);padding:24px 30px;text-align:center;display:grid;gap:8px;pointer-events:none;
  box-shadow:0 24px 50px -20px rgba(90,50,20,.6);max-width:calc(100% - 32px);width:max-content;animation:cpop 2.3s ease forwards;border-top:6px solid var(--orange)}
.celebrate b{font-family:var(--display);font-style:italic;font-weight:500;font-size:clamp(30px,7vw,42px);line-height:1}
.celebrate span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
@keyframes cpop{0%{opacity:0;transform:translate(-50%,-40%) rotate(-2deg)}8%,85%{opacity:1;transform:translate(-50%,-50%) rotate(-2deg)}100%{opacity:0;transform:translate(-50%,-56%) rotate(-2deg)}}
/* предложи своё */
.suggest{background:var(--orange);color:#fff;padding:clamp(24px,5vw,48px);display:grid;gap:22px;position:relative;overflow:hidden}
@media (min-width:860px){.suggest{grid-template-columns:1fr 1fr;align-items:end}}
.suggest h2{color:#fff}
.suggest h2 em{color:var(--paper)}
.suggest p{margin:0;max-width:40ch;opacity:.95}
.suggest form{display:grid;gap:10px;min-width:0}
.suggest label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:600}
.suggest input,.suggest textarea{font:500 14px var(--body);color:var(--ink);background:var(--paper);border:0;border-radius:2px;padding:12px 14px;width:100%}
.suggest textarea{min-height:88px;resize:vertical}
.suggest .send{font:600 12px var(--body);letter-spacing:.18em;text-transform:uppercase;background:var(--ink);color:var(--paper);border:0;padding:14px 18px;cursor:pointer;justify-self:start}
.thanks{font-family:var(--display);font-style:italic;font-size:24px}

/* партнёры */
.partners{display:grid;gap:18px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding-block:28px}
@media (min-width:860px){.partners{grid-template-columns:1fr 1fr;align-items:center}}
.partners p{margin:0;color:var(--ink-soft);max-width:46ch}
.offer{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.offer li{border:1px solid var(--ink);border-radius:999px;padding:6px 12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase}

footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:11px;color:var(--ink-soft);letter-spacing:.06em}

/* модалка */
.modal{position:fixed;inset:0;background:rgba(58,42,31,.6);display:grid;place-items:center;padding:16px;z-index:30}
.card{background:var(--paper);max-width:440px;width:100%;padding:14px 14px 22px;position:relative;display:grid;gap:14px;max-height:calc(100% - 32px);overflow:auto}
.card .shot{aspect-ratio:16/10}
.card .shot h3{font-size:30px}
.card .body{display:grid;gap:12px;padding-inline:8px}
.card p{margin:0;color:var(--ink-soft)}
.card .status{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--orange-deep)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{background:var(--orange);border-color:var(--orange)!important;color:#fff!important}
.links a,.links span{font:600 11px var(--body);letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--ink);color:var(--ink);padding:10px 14px;text-decoration:none}
.links span{opacity:.4}
.close{position:absolute;right:20px;top:18px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 18px;z-index:35;font-size:13px;max-width:calc(100% - 32px);text-align:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:32;width:100%;height:100%}
button:focus-visible,a:focus-visible,.frame:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--orange-deep);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <span class="logo">mr. &amp; mrs. six</span>
    <div class="socials"><a href="https://www.instagram.com/mr.and.mrs.six/" target="_blank" rel="noopener" aria-label="Instagram @mr.and.mrs.six"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="17.3" cy="6.7" r="1.1" fill="currentColor"/></svg></a><span class="soon" aria-label="YouTube скоро" title="YouTube скоро"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10 9.2v5.6l4.8-2.8z" fill="currentColor"/></svg></span></div>
    <div class="lang" role="group" aria-label="Язык">
      <button type="button" data-lang="ru" aria-pressed="true">RU</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <section class="hero">
    <div class="hero-text">
      <span class="eyebrow" data-i="eyebrow"></span>
      <h1 data-i="h1"></h1>
      <p class="lede" data-i="lede"></p>
      <div class="facts">
        <div class="fact"><b id="fOpen">0</b><span data-i="fOpen"></span></div>
        <div class="fact"><b id="fDone">0</b><span data-i="fDone"></span></div>
        <div class="fact"><b id="fDays">0</b><span data-i="fDays"></span></div>
      </div>
    </div>
    <figure class="polaroid" style="margin:0">
      <div class="ph"><img src="img/hero.webp" alt="Оля и Илья Лапинские" id="heroImg"><span class="datestamp">10 &#39;26</span></div>
      <figcaption data-i="cap"></figcaption>
    </figure>
  </section>

  <section>
    <div class="section-head">
      <div>
        <span class="eyebrow" data-i="listEyebrow"></span>
        <h2 id="mTitle"></h2>
        <p class="sub" id="mSub"></p>
      </div>
      <div class="hint" id="hint" hidden></div>
    </div>
  </section>

  <nav class="strip" aria-label="Месяцы"><ul id="months"></ul></nav>
  <div class="openall" id="openAll" hidden>
    <button type="button" id="openAllBtn"><span class="oa-big" data-i="oaBig"></span><span class="oa-small" data-i="oaSmall"></span></button>
  </div>
  <p class="scratch-hint" id="scratchHint" data-i="hint"></p>
  <div class="grid" id="grid"></div>

  <section class="suggest">
    <div style="display:grid;gap:14px">
      <span class="eyebrow" style="color:#fff" data-i="sgEyebrow"></span>
      <h2 data-i="sgH"></h2>
      <p data-i="sgP"></p>
    </div>
    <form id="sgForm" novalidate>
      <p hidden><label>bot <input name="bot-field"></label></p>
      <label for="sgName" data-i="sgName"></label>
      <input id="sgName" type="text" name="nickname" autocomplete="off" placeholder="@instagram" required>

  hb.onclick=e=>{e.stopPropagation();const on=!hearts.has(w.id);on?hearts.add(w.id):hearts.delete(w.id);store('gm2-hearts',[...hearts]);
    hb.setAttribute('aria-pressed',on);if(remoteOk)remote[w.id]=Math.max(0,(remote[w.id]||0)+(on?1:-1));paintHearts();
    track(on?'heart_add':'heart_remove',{wish_id:w.id});sendHeart(w.id,on?1:-1).catch(()=>{});};
  const reveal=()=>{el.classList.add('revealed');el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',x.t);};
  el.addEventListener('click',()=>{if(el.classList.contains('revealed'))openModal(w);});
  el.addEventListener('keydown',e=>{if(e.target!==el||(e.key!=='Enter'&&e.key!==' '))return;e.preventDefault();el.classList.contains('revealed')?openModal(w):finish();});
  if(scratched.has(w.id)||w.status==='done'){cv.remove();reveal();return el;}
  el.tabIndex=0; el.setAttribute('aria-label','№'+w.id+'. '+L().reveal);
  function finish(quiet){if(scratched.has(w.id))return;scratched.add(w.id);store('gm2-scr',[...scratched]);
    cv.classList.add('gone');setTimeout(()=>cv.remove(),550);reveal();track('scratch_card',{wish_id:w.id});if(quiet)return;const r=el.getBoundingClientRect();confetti(r.left+r.width/2,r.top+r.height/2);}
  el._finish=finish;
  setupScratch(cv,w.id,finish,null);
  return el;
}
function setupScratch(cv,id,done,onTap){
  const ctx=cv.getContext('2d'); let drawing=false,last=null,moves=0,ready=false;
  function paint(){const r=cv.getBoundingClientRect();if(!r.width)return;const dpr=Math.min(2,devicePixelRatio||1);
    cv.width=r.width*dpr;cv.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalCompositeOperation='source-over';
    const g=ctx.createLinearGradient(0,0,0,r.height);g.addColorStop(0,'#8fb3d6');g.addColorStop(.48,'#f6c99a');g.addColorStop(.72,'#ee9b5b');g.addColorStop(1,'#d9662b');
    ctx.fillStyle=g;ctx.fillRect(0,0,r.width,r.height);
    const s=ctx.createRadialGradient(r.width/2,r.height*.66,2,r.width/2,r.height*.66,r.width*.28);s.addColorStop(0,'rgba(255,240,210,.95)');s.addColorStop(1,'rgba(255,240,210,0)');
    ctx.fillStyle=s;ctx.fillRect(0,0,r.width,r.height);
    for(let i=0;i<r.width*r.height/9;i++){ctx.fillStyle=Math.random()<.5?'rgba(255,255,255,.22)':'rgba(60,30,10,.12)';ctx.fillRect(Math.random()*r.width,Math.random()*r.height,1,1);}
    ctx.fillStyle='#fff';ctx.font='600 10px Montserrat, sans-serif';ctx.fillText('№'+pad(id),12,22);
    ctx.textAlign='center';ctx.font='italic 500 '+Math.round(r.width/5.2)+'px "Cormorant Garamond", Georgia, serif';
    ctx.fillText(onTap?(lang==='ru'?'нажми':'tap'):(lang==='ru'?'сотри,':'scratch'),r.width/2,r.height*.42);
    ctx.font='600 9px Montserrat, sans-serif';ctx.fillText((lang==='ru'?'ЧТОБЫ УЗНАТЬ,':'TO SEE'),r.width/2,r.height*.42+18);ctx.fillText((lang==='ru'?'ЧТО ВНУТРИ':'WHAT’S INSIDE'),r.width/2,r.height*.42+31);
    ctx.textAlign='start';ready=true;}
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>requestAnimationFrame(paint));
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.clientWidth/r.width,y:(e.clientY-r.top)*cv.clientHeight/r.height};};
  const line=(a,b)=>{ctx.globalCompositeOperation='destination-out';ctx.lineWidth=Math.max(26,cv.clientWidth/5.5);ctx.lineCap=ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();};
  const cleared=()=>{try{const d=ctx.getImageData(0,0,cv.width,cv.height).data;let c=0,t=0;for(let i=3;i<d.length;i+=96){t++;if(d[i]<40)c++;}return c/t;}catch(e){return 0;}};
  cv.addEventListener('pointerdown',e=>{if(onTap){e.preventDefault();onTap();return;}if(!ready)return;drawing=true;cv.setPointerCapture(e.pointerId);last=pos(e);line(last,{x:last.x+.1,y:last.y});});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);line(last,p);last=p;if(++moves%12===0&&cleared()>.5){drawing=false;done();}});
  const up=()=>{if(!drawing)return;drawing=false;if(cleared()>.5)done();};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
}
function openAll(){
  const frames=[...document.querySelectorAll('#grid .frame')].filter(f=>f._finish&&f.querySelector('canvas.scratch:not(.gone)'));
  if(!frames.length)return;
  $('openAll').hidden=true;
  frames.forEach((f,i)=>setTimeout(()=>f._finish(true),i*15));
  setTimeout(celebrate,200);
}
$('openAllBtn').onclick=openAll;
function celebrate(){
  const add=(cls,html)=>{const d=document.createElement('div');d.className=cls;if(html)d.innerHTML=html;document.body.appendChild(d);return d;};
  const msg=add('celebrate','<b>'+(lang==='ru'?'20 желаний открыто':'20 wishes revealed')+'</b><span>'+(lang==='ru'?'ставь ♥︎ тому, что ждёшь больше всего':'tap ♥︎ on the one you can’t wait for')+'</span>');
  setTimeout(()=>msg.remove(),2300);
  if(reduce)return;
  const leak=add('leak');setTimeout(()=>leak.remove(),1200);
  const cols=['#c8452f','#ee9b5b','#8fb3d6','#6b7f45','#d9662b'];
  for(let i=0;i<28;i++){const h=add('floatheart',heartSvg);
    h.style.left=(Math.random()*100)+'vw';h.style.color=cols[i%cols.length];
    h.style.setProperty('--d',(1.3+Math.random()*.8)+'s');h.style.setProperty('--x',((Math.random()-.5)*120)+'px');h.style.setProperty('--r',((Math.random()-.5)*60)+'deg');
    h.style.animationDelay=(Math.random()*.3)+'s';const sz=16+Math.random()*20;h.style.width=h.style.height=sz+'px';
    setTimeout(()=>h.remove(),2600);}
}
function openModal(w){track('open_wish',{wish_id:w.id});
  const x=wt(w);
  const ph=w.photo&&PHOTOS[w.photo];
  $('mShot').className='shot c'+w.color+(ph?' photo':''); $('mShot').style.backgroundImage=ph?'url('+ph+')':''; $('mShot').style.setProperty('background-position',ph&&w.pos?w.pos:'','important');
  $('mShot').style.aspectRatio=ph?'4/5':''; $('mNo').textContent='№'+pad(w.id);
  $('mH').textContent=x.t; $('mPlace').textContent=x.p;
  $('mStatus').textContent=w.status?L()[w.status]:L().waiting;
  $('mText').textContent=x.d||'';
  const lk=w.links||{};
  $('mLinks').innerHTML=(lk.reels||lk.yt)?((lk.reels?'<a href="'+lk.reels+'" target="_blank" rel="noopener">'+L().reels+' ↗</a>':'')+(lk.yt?'<a href="'+lk.yt+'" target="_blank" rel="noopener">'+L().yt+' ↗</a>':'')):'';
  $('modal').hidden=false; $('mClose').focus();
}
$('mClose').onclick=()=>$('modal').hidden=true;
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')$('modal').hidden=true;});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').hidden=true;});
if($('reset'))$('reset').onclick=()=>{months[current].items.forEach(w=>scratched.delete(w.id));store('gm2-scr',[...scratched]);renderGrid();toast(L().reset2);};

$('sgForm').addEventListener('submit',e=>{e.preventDefault();const v=$('sgWish').value.trim();if(!v){toast(L().empty);$('sgWish').focus();return;}
  if(!$('sgName').value.trim()){toast(lang==='ru'?'Впиши свой инстаграм, чтобы мы могли тебя отметить':'Add your Instagram so we can tag you');$('sgName').focus();return;}
  const f=$('sgForm'),btn=f.querySelector('.send');btn.disabled=true;
  const fd=new FormData(f);if(fd.get('bot-field')){f.hidden=true;$('sgThanks').hidden=false;return;}
  fetch(SB_URL+'/rest/v1/suggestions',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({nickname:(fd.get('nickname')||'').trim().slice(0,80),wish:(fd.get('wish')||'').trim().slice(0,1000),lang})})
   .then(r=>{if(!r.ok)throw new Error(r.status);track('suggest_wish');f.hidden=true;$('sgThanks').hidden=false;})
   .catch(()=>{btn.disabled=false;toast(lang==='ru'?'Не отправилось, попробуй ещё раз':'Could not send, please try again');});});

let tt; function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2200);}

const cc=$('confetti'),cx=cc.getContext('2d');let parts=[],raf=null;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(x,y){if(reduce)return;cc.width=innerWidth;cc.height=innerHeight;const cols=['#ee9b5b','#8fb3d6','#c8452f','#6b7f45','#fbf6ee','#f6c99a'];
 for(let i=0;i<70;i++)parts.push({x,y,vx:(Math.random()-.5)*8,vy:-Math.random()*8-3,s:4+Math.random()*5,c:cols[i%cols.length],r:Math.random()*6,l:80+Math.random()*30});if(!raf)loop();}
function loop(){cx.clearRect(0,0,cc.width,cc.height);parts=parts.filter(p=>p.l-->0);
 parts.forEach(p=>{p.vy+=.26;p.x+=p.vx;p.y+=p.vy;p.r+=.18;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore();});
 raf=parts.length?requestAnimationFrame(loop):(cx.clearRect(0,0,cc.width,cc.height),null);}

document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href]');if(!a)return;const h=a.href;
  if(h.startsWith('mailto:'))track('click_email');
  else if(h.includes('ig.me'))track('click_collab');
  else if(a.closest('#mLinks'))track(h.includes('youtu')?'click_youtube_video':'click_reels');
  else if(h.includes('instagram.com'))track('click_instagram');
  else if(h.includes('youtu'))track('click_youtube');});
applyLang();
})();

/* photos load only when a card gets near the screen */
(function(){const set=el=>{el.style.backgroundImage='url('+el.dataset.bg+')';el.removeAttribute('data-bg');};
 const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);set(e.target);}}),{rootMargin:'600px 0px'}):null;
 const scan=r=>(r.querySelectorAll?r:document).querySelectorAll('[data-bg]').forEach(el=>io?io.observe(el):set(el));
 new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1){if(n.dataset&&n.dataset.bg)io?io.observe(n):set(n);scan(n);}}))).observe(document.documentElement,{childList:true,subtree:true});
 scan(document);})();
